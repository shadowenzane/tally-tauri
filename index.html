<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>TALLY · 演讲倒计时</title>
    <script>
      // 浏览器直开时的最小 mock（Tauri 环境已存在 __TAURI_INTERNALS__，此段不生效）
      // 仅用于开发期视觉核对：让窗口 API 走 reject 路径而非同步崩溃
      if (!window.__TAURI_INTERNALS__) {
        window.__TAURI_INTERNALS__ = {
          metadata: { currentWindow: { label: 'main' }, currentWebview: { label: 'main' } },
          invoke: function () { return Promise.reject(new Error('no tauri')); },
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
