name: Build TALLY

# 出包：macOS dmg + Windows exe（NSIS 安装器 + 便携 exe）
# 触发：手动运行（workflow_dispatch）或推送 v* 标签
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tally-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tally-tauri/src-tauri
      - name: Install frontend deps
        working-directory: tally-tauri
        run: npm ci
      - name: Build dmg
        working-directory: tally-tauri
        run: npx tauri build --target aarch64-apple-darwin
      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: TALLY-macOS-aarch64
          path: tally-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tally-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tally-tauri/src-tauri
      - name: Install frontend deps
        working-directory: tally-tauri
        run: npm ci
      # targets: nsis 安装器 + 便携 exe 一起产出
      - name: Build Windows installers
        working-directory: tally-tauri
        shell: bash
        run: npx tauri build --bundles nsis
      - name: Upload exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TALLY-Windows-x64
          path: |
            tally-tauri/src-tauri/target/release/bundle/nsis/*.exe
            tally-tauri/src-tauri/target/release/tally-tauri.exe

  release:
    # 打标签时自动创建 GitHub Release 并附上全部产物
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
